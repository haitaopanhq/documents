---
name: Build and Publish Documents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # Manual trigger

jobs:
  md-check:
    name: Markdown Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Markdown Files
        run: .github/scripts/md_check.sh

  build-personal:
    needs: md-check
    uses: ./.github/workflows/build-personal.yml

  build-solutions:
    needs: md-check
    uses: ./.github/workflows/build-solutions.yml

  build-interview:
    needs: md-check
    uses: ./.github/workflows/build-interview.yml

  build-roadmap:
    needs: md-check
    uses: ./.github/workflows/build-roadmap.yml

  build-ai-platform:
    needs: md-check
    uses: ./.github/workflows/build-ai-platform.yml

  build-others:
    needs: md-check
    uses: ./.github/workflows/build-others.yml

  release:
    name: GitHub Release & Deploy
    needs:
      - build-personal
      - build-solutions
      - build-interview
      - build-roadmap
      - build-ai-platform
      - build-others
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.md-check.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG_NAME: release-v${{ github.run_number }}-${{ github.run_id }}
      RSYNC_SSH_KEY: ${{ secrets.RSYNC_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      RSYNC_SSH_USER: ${{ secrets.RSYNC_SSH_USER }}
      REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare unique release assets
        run: .github/scripts/prepare_release_assets.sh artifacts release_assets

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            release_assets/*.pdf
            release_assets/*.docx
            release_assets/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure deps (rsync, ssh)
        run: .github/scripts/ensure_deps.sh

      - name: Init SSH
        run: .github/scripts/init_ssh.sh

      - name: Rsync release assets to remote
        run: .github/scripts/rsync_all_assets.sh artifacts
